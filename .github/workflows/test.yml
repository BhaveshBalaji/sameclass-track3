name: API checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - run: ruff check .
      - run: pytest -q
  bot-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: ray
          POSTGRES_USER: ray
          POSTGRES_PASSWORD: ray_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ray -d ray"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:db
      - run: npm run test:planning
      - run: npm run test:group
      - run: npm run replay
